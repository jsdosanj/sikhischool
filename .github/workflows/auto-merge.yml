name: Auto-merge

# Requests GitHub's native auto-merge on every PR opened against main — the
# PR then merges itself automatically once ci.yml's `validate` check (now
# required by branch protection) goes green, no human click needed. Added as
# part of docs/plans/expansion-plan-2026-09.md's per-phase deploy automation.
#
# This only REQUESTS auto-merge; GitHub still enforces the required status
# check (validate) before the merge actually happens — a red CI run never
# merges, it just sits with auto-merge armed until the branch is fixed or
# the PR is closed.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
