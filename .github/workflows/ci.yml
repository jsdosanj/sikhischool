name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Lint CSS (RTL-safety, plan §2 A5)
        run: npm run lint:css

      - name: RTL-safety check (Tailwind utilities, plan §2 A5)
        # stylelint (previous step) only sees raw CSS — the actual physical-
        # direction violations live in Tailwind utility classes inside JSX,
        # which this script greps for. Both are needed; neither alone covers
        # the real surface area.
        run: npm run lint:rtl

      - name: Build
        run: npm run build

      - name: Build Cloudflare Workers artifact
        # Green CI alone didn't used to prove the deploy artifact builds —
        # `npm run build` (next build) and `npm run cf:deploy` (opennextjs-
        # cloudflare build + deploy) are different pipelines. This is the
        # build half only (no deploy, no Cloudflare credentials needed) so
        # a red run here catches a broken deploy before merge, not after.
        # (outside-voice finding, eng review — docs/plans/expansion-plan-2026-09.md §14)
        run: npm run cf:build
